<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notes</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <style>
      :root { color-scheme: light dark; --accent: #3b5bdb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; background: Canvas; color: CanvasText; }
      main { max-width: 440px; padding: 32px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; opacity: 0.75; line-height: 1.5; }
      code { background: color-mix(in srgb, CanvasText 10%, transparent); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
      button { font: inherit; border: 0; border-radius: 999px; padding: 10px 22px; background: var(--accent); color: white; cursor: pointer; margin: 0 4px; }
      button.secondary { background: none; color: var(--accent); border: 1px solid var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Can’t reach Notes</h1>
      <p>The app could not connect to <code id="server"></code>.<br />
        Once Notes has loaded successfully once, it keeps working without a connection.</p>
      <button id="retry" type="button">Try again</button>
      <button id="change" type="button" class="secondary">Change server…</button>
    </main>
    <script>
      const server = new URLSearchParams(location.search).get('server') || '';
      document.getElementById('server').textContent = server;
      document.getElementById('retry').addEventListener('click', () => { if (server) location.href = server; });
      document.getElementById('change').addEventListener('click', () => window.notesConfig.openSettings());
      // Reconnect by itself as soon as the network comes back.
      addEventListener('online', () => server && (location.href = server));
    </script>
  </body>
</html>
